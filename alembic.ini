# Alembic configuration for the Stock Manager API database (#49).
#
#   alembic upgrade head      # create or upgrade the database
#   alembic current           # show the database's revision
#   alembic revision --autogenerate -m "describe change"   # after editing models.py
#
# The database URL is not set here: migrations/env.py uses DATABASE_URL from
# the environment or .env, the same as the API.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Readable revision file names: 0001_baseline.py, 0002_add_x.py, ...
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
