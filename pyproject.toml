[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-manager"
version = "0.9.0"
description = "A full-stack family stock management application."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "typer>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.0,<0.18",
]

[tool.setuptools.packages.find]
include = ["stock_manager*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Explicit, so a newer ruff does not silently add rules (0.17 widened the
# defaults: 296 new findings in CI). Pyflakes + the core pycodestyle errors.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["stock_manager"]
# The legacy CLI (own SQLite database) is out of scope for the API gate (#49).
omit = [
    "stock_manager/__main__.py",
    "stock_manager/cli.py",
    "stock_manager/config.py",
    "stock_manager/database.py",
]

[tool.coverage.report]
# Current API coverage. CI fails if a change makes it drop; raise it when it grows.
fail_under = 90
show_missing = true
skip_covered = true
